[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-vehicle-mtmct"
version = "0.7.0"
description = "Bounded identity confirmation for desktop multi-camera vehicle tracking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6", "scipy==1.18.1", "opencv-python==4.14.0.94",
    "pillow==12.3.0", "ultralytics==8.3.221", "lap==0.5.12",
    "torch==2.14.1", "torchvision==0.29.1", "matplotlib==3.11.2",
    "pandas==2.3.3", "motmetrics==1.4.0", "openvino==2025.4.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

